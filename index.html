<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Special+Elite&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="st.css">
  <script src="anti-save.js"></script>
</head>
<body>
  <!-- rough ink edge, used by the name and the tagline -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter></svg>

  <div id="gate"><b id="gateName"></b><p>click to open</p></div>
  <div class="bg"></div><div class="vig"></div><canvas id="ink"></canvas><div class="grain"></div>
  <div class="cur-ring"></div><div class="cur-dot"></div>

  <main class="stage" id="stage">
    <header class="top">
      <div class="who rv" style="--i:0">
        <div class="ava"><img id="ava" src="icon.jpg" alt=""><i class="dot s-offline" id="dot"></i></div>
        <div class="who-text"><b id="handle"></b><span id="statusText">Connecting</span></div>
      </div>

      <aside class="player rv" id="player" style="--i:0">
        <audio id="audio" loop></audio>
        <button class="play" id="playBtn" type="button" aria-label="Play/Pause"><img id="playIcon" src="https://api.iconify.design/lucide:play.svg?color=white" alt=""></button>
        <div class="track">
          <div class="title"><b id="trackTitle"></b><span class="eq"><i></i><i></i><i></i></span></div>
          <div class="from" id="trackArtist"></div>
          <div class="time-row"><span id="time">0:00</span><input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek"></div>
        </div>
        <div class="vol"><img src="https://api.iconify.design/lucide:volume-1.svg?color=white" alt=""><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"></div>
      </aside>
    </header>

    <section class="hero">
      <h1 class="name rv" id="name" style="--i:1"></h1>
      <p class="tag rv" style="--i:2"><span id="typed"></span><i class="caret"></i></p>
    </section>

    <footer class="bottom">
      <section class="page rv" style="--i:3" aria-label="Status">
        <dl>
          <div><dt>Name</dt><dd id="pName"></dd></div>
          <div><dt>Status</dt><dd id="pStatus"></dd></div>
          <div><dt>Doing</dt><dd id="pNow"></dd></div>
          <div><dt>Note</dt><dd id="pNote"></dd></div>
        </dl>
      </section>
      <nav class="socials rv" id="socials" style="--i:4"></nav>
    </footer>
  </main>

<script>
const CONFIG = {
  name: 'Art',
  tagline: 'The Crimson Judge',
  note: 'Your name is already written',
  handle: '@yourname',
  discordId: '1501806647637442621',
  music: { file: 'music.mp3', title: 'Untitled', artist: 'from me' },
  socials: [
    { name: 'Discord',   icon: 'discord',   url: '#' },
    { name: 'TikTok',    icon: 'tiktok',    url: 'https://www.tiktok.com/@k_ura_a1202?_r=1&_t=ZS-9ABEufD07sq' },
    { name: 'Instagram', icon: 'instagram', url: 'https://www.instagram.com/rugjangzx?stkn=MWt2c25qeXN2MTR3MQ%3D%3D&utm_source=qr' },
    { name: 'Roblox',    icon: 'roblox',    url: 'https://www.roblox.com/share?code=6f6e8a29ed61a6498d19fe97eae892b5&type=Profile&source=ProfileShare&stamp=1790821267323' },
  ]
};
/* =================================== */
const $ = id => document.getElementById(id);
const root = document.documentElement;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = n => `https://api.iconify.design/lucide:${n}.svg?color=white`;
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };

/* static content */
document.title = CONFIG.name;
$('name').textContent = CONFIG.name; $('gateName').textContent = CONFIG.name;
const fitName = () => $('name').style.setProperty('--fs', Math.max(64, Math.min(230, innerWidth * (innerWidth > 820 ? .46 : .8) / (CONFIG.name.length * .58))) + 'px');
fitName(); addEventListener('resize', fitName);
$('handle').textContent = CONFIG.handle;
$('socials').innerHTML = CONFIG.socials.map(s =>
  `<a class="soc" href="${esc(s.url)}" target="_blank" rel="noopener"><img src="https://api.iconify.design/simple-icons:${esc(s.icon)}.svg?color=white" alt=""><span>${esc(s.name)}</span></a>`).join('');

/* Discord presence (Lanyard) */
let S = null, baseNow = '';
const LABEL = { online: 'Online', idle: 'Idle', dnd: 'Do not disturb', offline: 'Offline' };
function render(d) {
  S = d;
  const u = d.discord_user || {};
  if (u.avatar) $('ava').src = `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${u.avatar.startsWith('a_') ? 'gif' : 'png'}?size=256`;
  if (u.username) $('handle').textContent = '@' + u.username;
  const st = d.discord_status || 'offline', acts = d.activities || [];
  $('dot').className = 'dot s-' + st;
  $('statusText').textContent = LABEL[st] + (d._demo ? ' (demo)' : '');
  $('pName').textContent = u.global_name || u.username || CONFIG.name;
  $('pStatus').textContent = LABEL[st];
  const c = acts.find(a => a.type === 4);
  $('pNote').textContent = (c && [c.emoji && !c.emoji.id ? c.emoji.name : '', c.state].filter(Boolean).join(' ')) || CONFIG.note;
  const sp = d.listening_to_spotify ? d.spotify : null, g = acts.find(a => a.type !== 4 && a.type !== 2);
  if (sp) baseNow = `Listening: ${sp.song} - ${sp.artist}`;
  else if (g) baseNow = `${({ 1: 'Streaming', 3: 'Watching', 5: 'Competing in' })[g.type] || 'Playing'} ${g.name}`;
  else baseNow = st === 'offline' ? 'Unseen' : 'Writing in silence';
  tick();
}
function tick() {
  if (!S) return;
  const now = Date.now(), sp = S.listening_to_spotify ? S.spotify : null, g = (S.activities || []).find(a => a.type !== 4 && a.type !== 2);
  let t = '';
  if (sp && sp.timestamps) t = `${fmt(now - sp.timestamps.start)} / ${fmt(sp.timestamps.end - sp.timestamps.start)}`;
  else if (g && g.timestamps && g.timestamps.start) t = fmt(now - g.timestamps.start);
  $('pNow').textContent = baseNow + (t ? ' | ' + t : '');
}
setInterval(tick, 1000);
function connect(id) {
  fetch(`https://api.lanyard.rest/v1/users/${id}`).then(r => r.json()).then(j => j.success && render(j.data)).catch(() => {});
  let hb; const ws = new WebSocket('wss://api.lanyard.rest/socket');
  ws.onmessage = ({ data }) => {
    const m = JSON.parse(data);
    if (m.op === 1) { hb = setInterval(() => ws.send(JSON.stringify({ op: 3 })), m.d.heartbeat_interval); ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: id } })); }
    if (m.op === 0) render(m.d);
  };
  ws.onclose = () => { clearInterval(hb); setTimeout(() => connect(id), 5000); };
}
if (CONFIG.discordId) {
  connect(CONFIG.discordId);
  const dc = $('socials').querySelector('a'); if (CONFIG.socials[0].icon === 'discord' && CONFIG.socials[0].url === '#') dc.href = `https://discord.com/users/${CONFIG.discordId}`;
} else {
  render({ _demo: true, discord_status: 'online', discord_user: {}, activities: [{ type: 0, name: 'something quiet', timestamps: { start: Date.now() - 1832000 } }] });
}

/* music */
const M = CONFIG.music, audio = $('audio'), player = $('player'), playIcon = $('playIcon'), seek = $('seek'), vol = $('vol');
const setPlay = on => { playIcon.src = icon(on ? 'pause' : 'play'); player.classList.toggle('on', on); };
const playNow = () => audio.play().then(() => setPlay(true)).catch(() => {});
audio.src = M.file; audio.volume = vol.value;
$('trackTitle').textContent = M.title; $('trackArtist').textContent = M.artist;
$('playBtn').onclick = () => audio.paused ? playNow() : (audio.pause(), setPlay(false));
audio.ontimeupdate = () => { $('time').textContent = fmt(audio.currentTime * 1000); if (audio.duration) seek.value = audio.currentTime / audio.duration * 100; };
seek.oninput = () => { if (audio.duration) audio.currentTime = seek.value / 100 * audio.duration; };
vol.oninput = () => audio.volume = vol.value;

/* gate + typed tagline */
function typeTag() {
  const t = CONFIG.tagline, el = $('typed'); let i = 0;
  if (reduce) { el.textContent = t; return; }
  (function s() { el.textContent = t.slice(0, ++i); if (i < t.length) setTimeout(s, 90 + Math.random() * 110); })();
}
$('gate').onclick = () => { $('gate').classList.add('open'); document.body.classList.add('in'); playNow(); setTimeout(typeTag, 800); };

/* hand-drawn "boil" on the rough ink edge */
const turb = $('turb'); let seedN = 1;
if (!reduce) setInterval(() => { if (!document.hidden) turb.setAttribute('seed', seedN = seedN % 12 + 1); }, 150);

/* mouse: red glow, parallax, ink trail, cursor */
const ring = document.querySelector('.cur-ring'), dot = document.querySelector('.cur-dot'), cv = $('ink'), cx = cv.getContext('2d');
let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my, pts = [];
const fit = () => { cv.width = innerWidth; cv.height = innerHeight; }; fit(); addEventListener('resize', fit);
addEventListener('pointermove', e => {
  mx = e.clientX; my = e.clientY;
  dot.style.transform = `translate(${mx}px,${my}px)`;
  root.style.setProperty('--cx', mx + 'px'); root.style.setProperty('--cy', my + 'px');
  root.style.setProperty('--dx', (mx / innerWidth * 2 - 1).toFixed(3)); root.style.setProperty('--dy', (my / innerHeight * 2 - 1).toFixed(3));
  pts.push({ x: mx, y: my, t: performance.now() });
});
(function loop(t) {
  rx += (mx - rx) * .16; ry += (my - ry) * .16;
  ring.style.transform = `translate(${rx}px,${ry}px)`;
  cx.clearRect(0, 0, cv.width, cv.height);
  pts = pts.filter(p => t - p.t < 650);
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  for (let i = 1; i < pts.length; i++) {
    const k = 1 - (t - pts[i].t) / 650;
    cx.strokeStyle = `rgba(190,14,14,${(k * .85).toFixed(3)})`; cx.lineWidth = 1 + k * 6;
    cx.beginPath(); cx.moveTo(pts[i - 1].x, pts[i - 1].y); cx.lineTo(pts[i].x, pts[i].y); cx.stroke();
  }
  requestAnimationFrame(loop);
})(performance.now());
document.querySelectorAll('a, button, input').forEach(el => {
  el.addEventListener('pointerenter', () => ring.classList.add('big'));
  el.addEventListener('pointerleave', () => ring.classList.remove('big'));
});
addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });
</script>
</body>
</html>
